name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 验收步骤清单的唯一真源是 scripts/verify.mjs：矩阵各版本都只调用它，不在 YAML 里另写一份步骤，避免清单漂移
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          # 矩阵内不装 node 依赖、也不跑 pnpm 步骤，关掉自动缓存；
          # 否则 v5 会按 packageManager 字段自行选 pnpm 缓存，调用未安装的 pnpm 直接报 ENOENT
          package-manager-cache: false
      # 仓库不提交 composer.lock，交由各 PHP 版本自行解析，才能覆盖 8.2 与 8.3+ 的依赖差异
      - run: composer update --no-interaction --prefer-dist --no-progress
      # 文档站构建由 deploy-docs.yml 单独承担，矩阵内跳过以省时
      - name: 门禁校验（PHP 矩阵）
        run: node scripts/verify.mjs --skip-docs
