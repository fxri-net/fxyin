name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      # 仓库不提交 composer.lock，交由各版本自行解析，才能覆盖 8.2 与 8.3+ 的依赖差异
      - run: composer update --no-interaction --prefer-dist --no-progress
      # 唯一验收真源：与本地执行同一条命令，流水线不另抄步骤
      - run: composer check
