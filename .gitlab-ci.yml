# 自建托管平台一侧的流水线：与 GitHub 共用 scripts/verify.mjs 这一份验收步骤清单，
# 本文件只负责声明镜像、产物路径与部署规则
# 作业镜像由 ci-templates 依据 .ci/toolchain.json 动态构建（PHP 8.2 + Node 20），不再现场安装运行时

include:
  - project: fxri/develop/0001.base/ci-templates
    ref: main
    file: /dynamic-image.yml

stages:
  - test
  - pages

test:
  stage: test
  # 自建 runner 未放行 if-not-present 拉取策略，保持默认字符串形式
  image:
    name: $CI_IMAGE
    pull_policy: if-not-present
  needs:
    - toolchain:spec
    - toolchain:ensure
  variables:
    COMPOSER_ALLOW_SUPERUSER: "1"
    # Composer 缓存随 job 缓存一起持久化，避免每次重复下载依赖
    COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.cache/composer"
  cache:
    key:
      files:
        - composer.json
    paths:
      - .cache/composer
  script:
    # 镜像内已把 Packagist 源指向腾讯云镜像，这里只需解析依赖
    # 仓库不提交 composer.lock，由当前 PHP 版本自行解析依赖
    - composer update --no-interaction --prefer-dist --no-progress
    # 文档站构建在 pages 阶段单独执行，此处跳过
    - node scripts/verify.mjs --skip-docs

pages:
  stage: pages
  image:
    name: $CI_IMAGE
    pull_policy: if-not-present
  needs:
    - toolchain:spec
    - toolchain:ensure
  # 完整克隆：文档站 lastUpdated 依赖 git 提交时间，浅克隆会失真
  variables:
    GIT_DEPTH: "0"
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  script:
    # 站点参数优先取 CI/CD 变量；未定义时按 GitLab Pages 的默认形态推导，避免把路径写死在仓库里
    - export VITEPRESS_BASE="${VITEPRESS_BASE:-/$CI_PROJECT_NAME/}"
    # 站点实际挂在 /<项目名>/ 下，而 $CI_PAGES_URL 带完整命名空间路径、且不带尾斜杠：
    # 取其协议与主机作为站点根，再按项目名拼接并补尾斜杠。VitePress 的 sitemap/canonical
    # 按 hostname 相对拼接，路径或尾斜杠不对都会拼出访问不到的地址
    - export PAGES_ORIGIN="$(printf '%s' "$CI_PAGES_URL" | cut -d/ -f1-3)"
    - export SITE_URL="${SITE_URL:-$PAGES_ORIGIN/$CI_PROJECT_NAME/}"
    - export REPO_URL="${REPO_URL:-$CI_PROJECT_URL}"
    # pnpm 版本由镜像固定，无需现场安装
    - pnpm install --frozen-lockfile --store-dir .pnpm-store
    - pnpm docs:build
    # GitLab Pages 只发布 public/ 目录，构建产物在此归位
    - rm -rf public
    - mv docs/.vitepress/dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
